<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoShop - Iniciar Sesión</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: #1f2937;
            font-size: 1.8rem;
        }

        .login-card p.subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #4338ca;
        }

        .divider {
            margin: 25px 0 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .register-section p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .btn-register {
            display: inline-block;
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: #4f46e5;
            border: 2px solid #4f46e5;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            background-color: #f3f4f6;
            color: #4338ca;
        }

        .error-msg {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresa tus datos para continuar</p>

        <div id="errorMsg" class="error-msg">Correo o contraseña incorrectos.</div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="divider"></div>

        <div class="register-section">
            <p>¿No tienes una cuenta?</p>
            <a href="registro.html" class="btn-register">Registrarse</a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");

            const usuarios = JSON.parse(localStorage.getItem("usuariosTecnoShop")) || [];
            
            // Buscar credenciales coincidentes
            const usuarioValido = usuarios.find(u => u.email === email && u.password === password);

            if (usuarioValido) {
                // Guardar la información completa del usuario en la sesión activa
                localStorage.setItem("usuarioSesion", JSON.stringify({
                    nombre: usuarioValido.nombre,
                    email: usuarioValido.email,
                    usuario: usuarioValido.usuario,
                    rut: usuarioValido.rut
                }));
                
                // Redirigir a la página principal
                window.location.href = "index.html";
            } else {
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
