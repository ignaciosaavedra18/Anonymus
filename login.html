<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        /* Reseteo básico y tipografía */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Centrado perfecto vertical y horizontal */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 20px;
        }

        /* Tarjeta principal del formulario */
        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: #1f2937;
            font-size: 1.8rem;
        }

        .login-card p.subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Estructura de inputs */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        /* Botón principal para enviar formulario */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #4338ca;
        }

        /* División visual */
        .divider {
            margin: 25px 0 20px;
            border-bottom: 1px solid #e5e7eb;
            position: relative;
        }

        /* Sección para ir al registro */
        .register-section p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        /* Botón / enlace hacia registro.html */
        .btn-register {
            display: inline-block;
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: #4f46e5;
            border: 2px solid #4f46e5;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            background-color: #f3f4f6;
            color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresa tus datos para continuar</p>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="divider"></div>

        <div class="register-section">
            <p>¿No tienes una cuenta o no puedes ingresar?</p>
            <!-- Redirección directa al archivo registro.html -->
            <a href="registro.html" class="btn-register">Registrarse</a>
        </div>
    </div>

</body>
</html>
