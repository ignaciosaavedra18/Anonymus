<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TecnoShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Principal (El mismo de tus otras páginas) -->
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="brand-link">
                <img src="images/LogoTienda.jpg" alt="Logo TecnoShop" class="header-logo-img">
                <div class="brand-box">
                    <span class="logo">TecnoShop</span>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Catálogo</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html" class="active">Acceso</a></li>
                    <li>
                        <a href="carrito.html" class="cart-icon">
                            🛒 <span class="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenedor del formulario de Login -->
    <main class="main-content" style="display: flex; justify-content: center; padding: 50px 20px;">
        <div class="login-caja">
            <h2>Bienvenido</h2>
            <p>Ingresa tus datos para continuar</p>

            <div id="errorMsg" class="alerta-error" style="display: none;">
                Correo o contraseña incorrectos.
            </div>

            <form id="loginForm">
                <div class="grupo-input">
                    <label>Correo electrónico:</label>
                    <input type="email" id="email" placeholder="tu@correo.com" required>
                </div>

                <div class="grupo-input">
                    <label>Contraseña:</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-primario">Iniciar Sesión</button>
            </form>

            <hr style="margin: 20px 0; border: 1px solid #ddd;">

            <div style="text-align: center;">
                <p>¿No tienes una cuenta?</p>
                <a href="registro.html" class="btn-secundario">Registrarse</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 TecnoShop</p>
    </footer>

    <!-- Script básico para el Login -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(evento) {
            evento.preventDefault(); // Evita que la página recargue
            
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            
            // Traemos los usuarios guardados o creamos una lista vacía
            let usuarios = JSON.parse(localStorage.getItem("usuariosTecnoShop")) || [];
            
            let usuarioEncontrado = null;
            
            // Buscamos si existe el usuario con un for básico (muy de estudiante)
            for(let i = 0; i < usuarios.length; i++) {
                if(usuarios[i].email === email && usuarios[i].password === password) {
                    usuarioEncontrado = usuarios[i];
                    break;
                }
            }

            if (usuarioEncontrado != null) {
                // Guardar la sesión y redirigir
                localStorage.setItem("usuarioSesion", JSON.stringify(usuarioEncontrado));
                window.location.href = "index.html";
            } else {
                // Mostrar error
                document.getElementById("errorMsg").style.display = "block";
            }
        });
    </script>
</body>
</html>
