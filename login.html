<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <h1 class="logo"><a href="index.html">TechStore</a></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="login.html" class="active">Iniciar Sesión</a></li>
                    <li><a href="registro.html">Registrarse</a></li>
                    <li>
                        <a href="carrito.html" class="cart-icon">
                            🛒 Carrito <span class="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="form-section">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" class="form-container" novalidate>
                <div id="errorMessages" class="alert-container"></div>

                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" name="email" placeholder="usuario@duoc.cl" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 TechStore - Proyecto Fullstack II (Duoc UC)</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
