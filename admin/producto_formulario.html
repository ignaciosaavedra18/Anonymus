<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Producto - TecnoShop</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="../index.html" class="brand-link">
                <img src="../images/LogoTienda.jpg" alt="Logo TecnoShop" class="header-logo-img">
                <div class="brand-box">
                    <span class="logo">TecnoShop Admin</span>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Panel Inicio</a></li>
                    <li><a href="productos.html" class="active">Productos</a></li>
                    <li><a href="#">Usuarios</a></li>
                    <li><a href="../index.html" style="color: #ef4444;">Salir</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content" style="display: flex; justify-content: center; padding: 40px 20px;">
        
        <div class="login-caja">
            <h2>Datos del Producto</h2>
            <p>Ingresa los datos para guardar en el catálogo</p>

            <form id="formAdmin" onsubmit="return guardarDatos(event)">
                <div class="grupo-input">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="nombreProd" placeholder="Ej: Monitor 144hz">
                </div>

                <div class="grupo-input">
                    <label>Categoría:</label>
                    <select id="categoriaProd" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        <option value="">Selecciona...</option>
                        <option value="Notebooks">Notebooks</option>
                        <option value="Perifericos">Periféricos</option>
                        <option value="Componentes">Componentes PC</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label>Precio ($):</label>
                    <input type="number" id="precioProd" placeholder="Ej: 150000">
                </div>

                <button type="submit" class="btn-primario">Guardar Producto</button>
                <a href="productos.html" class="btn-secundario" style="margin-top: 10px;">Cancelar</a>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 TecnoShop - Panel de Administración</p>
    </footer>

    <script>
        function guardarDatos(evento) {
            evento.preventDefault(); 
            
            let nombre = document.getElementById("nombreProd").value;
            let categoria = document.getElementById("categoriaProd").value;
            let precio = document.getElementById("precioProd").value;

            // Validacion tipica de estudiante
            if (nombre == "" || categoria == "" || precio == "") {
                alert("Cuidado: Todos los campos son obligatorios.");
                return false;
            }

            if (precio <= 0) {
                alert("Cuidado: El precio no puede ser cero o negativo.");
                return false;
            }

            alert("¡Listo! Producto guardado exitosamente.");
            window.location.href = "productos.html";
        }
    </script>
</body>
</html>
