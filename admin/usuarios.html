<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mantenedor de Usuarios</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="../index.html" class="brand-link">
                <img src="../images/LogoTienda.jpg" alt="Logo TecnoShop" class="header-logo-img">
                <div class="brand-box">
                    <span class="logo">TecnoShop Admin</span>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Panel Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="usuarios.html" class="active">Usuarios</a></li>
                    <li><a href="../index.html" style="color: #ef4444;">Salir</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h2>Mantenedor de Usuarios</h2>

        <div class="login-caja" style="max-width: 100%; margin-bottom: 2rem;">
            <h3>Registrar Usuario</h3>
            <form id="adminUserForm" onsubmit="return agregarUsuario(event)">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label>RUN / RUT:</label>
                        <input type="text" id="uRun" placeholder="19011022K" style="width:100%; padding:8px;">
                    </div>
                    <div>
                        <label>Nombre Completo:</label>
                        <input type="text" id="uNombre" placeholder="Juan Pérez" style="width:100%; padding:8px;">
                    </div>
                    <div>
                        <label>Correo Electrónico:</label>
                        <input type="email" id="uEmail" placeholder="usuario@gmail.com" style="width:100%; padding:8px;">
                    </div>
                </div>
                <button type="submit" class="btn-primario" style="width: auto; padding: 8px 20px;">Guardar Usuario</button>
            </form>
        </div>

        <section>
            <h3>Usuarios Registrados</h3>
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>RUN</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Opciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios">
                    <tr>
                        <td>19011022K</td>

                        <td>José Alfonso</td>
                        
                        <td>jose.alfonso@gmail.com</td>
                        <td>
                            <button onclick="borrarUser(this)" style="padding: 4px 8px; background: #ef4444; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer;">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer class="footer">
        <p> TecnoShop - Panel de Administración</p>
    </footer>

    <script>
        function agregarUsuario(event) {
            event.preventDefault();
            let run = document.getElementById("uRun").value.trim();
            let nombre = document.getElementById("uNombre").value.trim();
            let email = document.getElementById("uEmail").value.trim();

            if (rut === "" || nombre === "" || email === "") {
                alert("Por favor, completa todos los campos del usuario.");
                return false;
            }

            let tbody = document.getElementById("tabla-usuarios");
            let nuevaFila = document.createElement("tr");

            nuevaFila.innerHTML = `
                <td>${rut }</td>

                <td>${nombre }</td>

                <td>${email }</td>
                <td>
                    <button onclick="borrarUser(this)" style="padding: 4px 8px; background: #ef4444; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer;">Eliminar</button>
                </td>
            `;

            tbody.appendChild(nuevaFila);
            document.getElementById("adminUserForm").reset();
            alert("Usuario agregado con éxito.");
        }

        function borrarUser(btn) {
            if (confirm("¿Eliminar usuario del sistema?")) {
                btn.closest("tr").remove();
            }
        }
    </script>
</body>
</html>
