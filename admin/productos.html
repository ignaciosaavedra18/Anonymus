<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - TecnoShop</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="../index.html" class="brand-link">
                <img src="../images/LogoTienda.jpg" alt="Logo TecnoShop" class="header-logo-img">
                <div class="brand-box">
                    <span class="logo">TecnoShop Admin</span>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Panel Inicio</a></li>
                    <li><a href="productos.html" class="active">Productos</a></li>
                    <li><a href="#">Usuarios</a></li>
                    <li><a href="../index.html" style="color: #ef4444;">Salir</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Lista de Productos</h2>
            <a href="producto_formulario.html" class="btn-primario" style="width: auto; text-decoration: none; background-color: #10b981;">+ Nuevo Producto</a>
        </div>

        <table class="tabla-admin">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre del Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Opciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>ASUS TUF Gaming A15</td>
                    <td>Notebooks</td>
                    <td>$719.990</td>
                    <td>
                        <a href="producto_formulario.html" class="btn-editar-admin">Editar</a>
                        <button class="btn-eliminar-admin" onclick="borrarFila()">Borrar</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Mouse Logitech G203</td>
                    <td>Periféricos</td>
                    <td>$21.990</td>
                    <td>
                        <a href="producto_formulario.html" class="btn-editar-admin">Editar</a>
                        <button class="btn-eliminar-admin" onclick="borrarFila()">Borrar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer class="footer">
        <p>TecnoShop - Panel de Administración</p>
    </footer>

    <script>
        function guardarDatos(evento) {
            evento.preventDefault();

            let nombre = document.getElementById("nombreProducto").value;
            let categoria = document.getElementById("categoriaProducto").value;
            let precio = document.getElementById("precioProducto").value;

            if (nombre == "" || categoria == "" || precio == "") {
                alert("Por favor, completa todos los campos.");
                return;

            }
            
            if (precio <= 0) {
                alert("El precio debe ser un número positivo.");
                return;
            }

            let productosGuardados = JSON.parse(localStorage.getItem("productos")) || [];
            
            let nuevoProducto = {
                id: productosGuardados.length + 100, // es 100 para que no llegue a molestar con lo que ya esta echoS
                nombre: nombre,
                categoria: categoria,
                precio: precio,
                img: "images/ASUS.png"
            };
            
            productosGuardados.push(nuevoProducto);
            localStorage.setItem("productos", JSON.stringify(productosGuardados));

            alert("Producto guardado exitosamente.");
            document.getElementById("formularioProducto").reset();
        }
    </script>
</body>
</html>_
