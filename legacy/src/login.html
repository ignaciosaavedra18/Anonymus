<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoShop - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  
    <header class="header">
        <div class="nav-container">
            <a href="../index.html" class="brand-link">
                <div class="brand-box">
                    <span class="logo">TecnoShop</span>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                </ul>
            </nav>
        </div>
    </header>

   
    <main class="main-content" style="display: flex; justify-content: center; padding: 60px 20px;">
        
        <div class="login-caja" style="max-width: 400px; width: 100%;">
            <h2 style="text-align: center; margin-bottom: 10px;">Bienvenido de vuelta</h2>
            <p style="text-align: center; margin-bottom: 20px;">Ingresa tus datos para continuar</p>

            <form id="formulario-login">
                <div class="grupo-input" style="margin-bottom: 15px;">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="email-login" placeholder="ejemplo@duoc.cl" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>

                <div class="grupo-input" style="margin-bottom: 20px;">
                    <label>Contraseña:</label>
                    <input type="password" id="pass-login" placeholder="********" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">Iniciar Sesión</button>
            </form>

            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                ¿No tienes una cuenta? <a href="registro.html" style="color: #6d28d9; text-decoration: none; font-weight: bold;">Regístrate aquí</a>
            </p>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const formLogin = document.getElementById("formulario-login");
            
            if(formLogin) {
                formLogin.addEventListener("submit", function(e) {
                    e.preventDefault();
                    
                    let emailIngresado = document.getElementById("email-login").value;
                    let usuarioGuardado = JSON.parse(localStorage.getItem("usuarioRegistrado"));

                    if (usuarioGuardado && usuarioGuardado.email === emailIngresado) {
                        alert("¡Bienvenido a TecnoShop!");
                        localStorage.setItem("usuarioSesion", JSON.stringify({ nombre: usuarioGuardado.email }));
                        window.location.href = "index.html"; 
                    } else {
                        alert("Error: El correo no está registrado o es incorrecto.");
                    }
                });
            }
        });
    </script>
</body>
</html>
