<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - TecnoShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <div class="brand-box">
                <h1 class="logo"><a href="index.html">TecnoShop</a></h1>
                <span class="sub-logo">Cotizador Hardware</span>
            </div>

            <div class="search-bar">
                <input type="text" placeholder="¿Qué buscas? Ej: RTX 4060, Ryzen 7...">
                <button type="button">🔍</button>
            </div>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Catálogo</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html">Acceso</a></li>
                    <li>
                        <a href="carrito.html" class="cart-icon">
                            🛒 <span class="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <!-- Formulario Estilo Imagen -->
        <div class="form-card">
            <!-- Cabecera del Cuadro -->
            <div class="form-card-header">
                <h2>Regístrate</h2>
                <a href="login.html" class="link-login">Iniciar Sesión</a>
            </div>

            <div class="form-card-body">
                <form id="registroForm" novalidate>
                    <div class="form-row">
                        <label for="regNombre">Nombre:</label>
                        <input type="text" id="regNombre" placeholder="Usuario">
                    </div>

                    <div class="form-row">
                        <label for="regRut">RUT / RUN:</label>
                        <input type="text" id="regRut" placeholder="12345678-K">
                    </div>

                    <div class="form-row">
                        <label for="regUser">Usuario:</label>
                        <input type="text" id="regUser" placeholder="usuario">
                    </div>

                    <div class="form-row">
                        <label for="regPass">Password:</label>
                        <input type="password" id="regPass" placeholder="Password">
                    </div>

                    <div class="form-row">
                        <label for="regConfirmPass">Confirmar Password:</label>
                        <input type="password" id="regConfirmPass" placeholder="Confirmar Password">
                    </div>

                    <div class="form-row">
                        <label for="regEmail">Email:</label>
                        <input type="email" id="regEmail" placeholder="usuario@duoc.cl">
                    </div>

                    <!-- Cuadro de Captcha Simulado -->
                    <div class="form-row">
                        <div></div> <!-- Espacio para alinear con los inputs -->
                        <div class="captcha-box">
                            <div class="captcha-checkbox">
                                <input type="checkbox" id="regCaptcha">
                                <label for="regCaptcha">No soy un robot</label>
                            </div>
                            <div class="captcha-logo">
                                
                                
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div></div>
                        <button type="submit" class="btn-primary btn-submit">Registrar</button>
                    </div>
                </form>

                <!-- Cuadro Rojo de Errores (Visualización dinámica) -->
                <div id="errorContainer" class="alert-error" style="display: none;">
                    <span class="close-alert" onclick="this.parentElement.style.display='none'">[X]</span>
                    <ul id="errorList">
                        <!-- Errores generados por validaciones.js -->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 TecnoShop - Proyecto Fullstack II (Duoc UC)</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
