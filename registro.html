<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoShop - Crear Cuenta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="brand-link">
                <div class="brand-box">
                    <span class="logo">TecnoShop</span>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content" style="display: flex; justify-content: center; padding: 40px 20px;">
        
        <div class="login-caja" style="max-width: 450px; width: 100%;">
            <h2 style="text-align: center; margin-bottom: 10px;">Crear Cuenta</h2>
            <p style="text-align: center; margin-bottom: 20px;">Únete a TecnoShop</p>

            <form id="formulario-registro">
    <div class="grupo-input">
        <label>Nombre:</label>
        <input type="text" id="nombre-usuario" maxlength="50" required placeholder="Juan">
    </div>

    <div class="grupo-input">
        <label>Apellidos:</label>
        <input type="text" id="apellido-usuario" maxlength="100" required placeholder="Pérez González">
    </div>

    <div class="grupo-input">
        <label>RUT (Sin puntos ni guión):</label>
        <input type="text" id="rut-usuario" minlength="7" maxlength="9" required placeholder="19011022K">
    </div>

    <div class="grupo-input">
        <label>Correo Electrónico:</label>
        <input type="email" id="email-usuario" maxlength="100" required placeholder="usuario@duoc.cl">
    </div>

    <div class="grupo-input">
        <label>Dirección:</label>
        <input type="text" id="direccion-usuario" maxlength="300" required placeholder="Av. Siempre Viva 123">
    </div>

    <div class="grupo-input">
        <label>Región:</label>
        <select id="select-region" required>
            <option value="">-- Seleccione una región --</option>
        </select>
    </div>

    <div class="grupo-input">
        <label>Comuna:</label>
        <select id="select-comuna" required disabled>
            <option value="">-- Seleccione una comuna --</option>
        </select>
    </div>

    <button type="submit" class="btn-primary">Registrarme</button>
    <p id="mensaje-respuesta" class="oculto"></p>
</form>

            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                ¿Ya tienes una cuenta? <a href="login.html" style="color: #6d28d9; text-decoration: none; font-weight: bold;">Inicia sesión aquí</a>
            </p>
        </div>

    </main>

    <script src="js/validaciones.js"></script>
</body>
</html>
