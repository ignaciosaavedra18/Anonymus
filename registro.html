<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <h1 class="logo"><a href="index.html">TechStore</a></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html">Iniciar Sesión</a></li>
                    <li><a href="registro.html" class="active">Registrarse</a></li>
                    <li>
                        <a href="carrito.html" class="cart-icon">
                            🛒 Carrito <span class="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="form-section">
            <h2>Crear una Cuenta</h2>
            <form id="registroForm" class="form-container" novalidate>
                <div id="errorMessages" class="alert-container"></div>

                <div class="form-group">
                    <label for="run">RUN / RUT (Sin puntos ni guión):</label>
                    <input type="text" id="run" name="run" placeholder="Ej: 19011022K" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="usuario@duoc.cl" required>
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña (4 a 10 caracteres):</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 TechStore - Proyecto Fullstack II (Duoc UC)</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
