<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoShop - Cotizador y Comparador de Hardware</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Principal -->
    <header class="header">
        <div class="nav-container">
            <!-- Brand / Logo Integrado -->
            <a href="index.html" class="brand-link">
                <img src="img/LogoTienda.jpg" alt="Logo TecnoShop" class="header-logo-img">
                <div class="brand-box">
                    <span class="logo">TecnoShop</span>
                    <span class="sub-logo">Cotizador Hardware</span>
                </div>
            </a>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="¿Qué buscas? Ej: RTX 4060, Ryzen 7, Notebook Gamer...">
                <button type="button">🔍</button>
            </div>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Inicio</a></li>
                    <li><a href="productos.html">Catálogo</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html">Acceso</a></li>
                    <li>
                        <a href="carrito.html" class="cart-icon">
                            🛒 <span class="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Barra de Categorías Rápidas -->
    <div class="sub-nav">
        <div class="sub-nav-container">
            <a href="productos.html?cat=notebooks">💻 Notebooks</a>
            <a href="productos.html?cat=gpus">🎮 Tarjetas de Video</a>
            <a href="productos.html?cat=cpus">🧠 Procesadores</a>
            <a href="productos.html?cat=ram">⚡ Memorias RAM</a>
            <a href="productos.html?cat=monitores">🖥️ Monitores</a>
            <a href="productos.html?cat=perifericos">🖱️ Periféricos</a>
        </div>
    </div>

    <main class="main-content">
        <!-- Banner Principal y Carrusel Solotodo -->
        <section class="main-banner">
            <div class="section-title-bar">
                <h2>🔥 Tendencias y Descuentos</h2>
                <a href="productos.html">Ver catálogo completo →</a>
            </div>

            <!-- Wrapper con flechas de navegación lateral -->
            <div class="carousel-wrapper">
                <button id="prevBtn" class="carousel-btn prev-btn" aria-label="Anterior">❮</button>

                <!-- Pista del carrusel (Renderizado dinámico mediante JS) -->
                <div id="carouselTrack" class="carousel-track">
                    <!-- Los productos guardados en catalogoProductos se cargarán aquí automáticamente -->
                </div>

                <button id="nextBtn" class="carousel-btn next-btn" aria-label="Siguiente">❯</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 TecnoShop - Proyecto Fullstack II (Duoc UC)</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>

    
</body>
</html>
